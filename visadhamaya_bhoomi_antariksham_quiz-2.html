const quiz=document.getElementById("quiz");
qs.forEach((q,i)=>{
 const box=document.createElement("div"); box.className="q";
 const title=document.createElement("div"); title.className="qtitle"; title.textContent=(i+1)+". "+q[0]; box.appendChild(title);
 q[1].forEach((ans,j)=>{
   const b=document.createElement("button"); b.className="opt"; b.textContent=String.fromCharCode(65+j)+") "+ans;
   b.onclick=()=>{
     if(box.dataset.done)return;
     box.dataset.done="1";
     box.querySelectorAll(".opt").forEach(x=>x.disabled=true);
     const ok=j===q[2]; b.classList.add(ok?"correct":"wrong");
     if(!ok) box.querySelectorAll(".opt")[q[2]].classList.add("correct");
     const e=document.createElement("div"); e.className="exp"; e.style.display="block";
     e.innerHTML="<b>"+(ok?"✅ ശരിയുത്തരം!":"❌ തെറ്റായ ഉത്തരം.")+"</b> "+q[3];
     box.appendChild(e);
     updateProgress();
   };
   box.appendChild(b);
 });
 quiz.appendChild(box);
});
function updateProgress(){
 let n=document.querySelectorAll(".q[data-done]").length;
 document.getElementById("progress").textContent=n+" / "+qs.length+" ചോദ്യങ്ങൾ പൂർത്തിയാക്കി";
}
document.getElementById("finish").onclick=()=>{
 let score=0,answered=0;
 document.querySelectorAll(".q").forEach((box,i)=>{
   if(box.dataset.done){
     answered++;
     if(box.querySelectorAll(".opt")[qs[i][2]].classList.contains("correct"))score++;
   }
 });
 let percent=Math.round(score/qs.length*100);
 let msg=percent>=90?"🌟 അതിഗംഭീരം!":percent>=75?"👏 വളരെ നല്ലത്!":percent>=50?"👍 നല്ല ശ്രമം!":"📚 കുറച്ച് കൂടി പരിശീലിക്കാം!";
 const r=document.getElementById("result"); r.style.display="block";
 r.innerHTML=msg+"<br><b>സ്കോർ: "+score+" / "+qs.length+" ("+percent+"%)</b><br>ഉത്തരം നൽകിയിരിക്കുന്നത്: "+answered+" / "+qs.length;
 r.scrollIntoView({behavior:"smooth"});
};
